version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokenwatcher
      POSTGRES_PASSWORD: tokenwatcher
      POSTGRES_DB: tokenwatcher
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenwatcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm start"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tokenwatcher:tokenwatcher@db:5432/tokenwatcher
      DIRECT_URL: postgresql://tokenwatcher:tokenwatcher@db:5432/tokenwatcher
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED:-true}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-change_me_in_production}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-change-me-in-production}
      DASHBOARD_SESSION_COOKIE_NAME: ${DASHBOARD_SESSION_COOKIE_NAME:-tokenwatcher_session}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      TOKENWATCHER_API_KEY: ${TOKENWATCHER_API_KEY:-tw_dev_key_change_me}
      INGEST_RATE_LIMIT_ENABLED: ${INGEST_RATE_LIMIT_ENABLED:-true}
      INGEST_RATE_LIMIT_WINDOW_SECONDS: ${INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      INGEST_RATE_LIMIT_MAX_REQUESTS: ${INGEST_RATE_LIMIT_MAX_REQUESTS:-120}
      INGEST_ALLOWED_ORIGINS: ${INGEST_ALLOWED_ORIGINS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
